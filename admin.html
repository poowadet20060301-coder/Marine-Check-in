<div id="loginForm" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:9999;">

    </main>

<script>
// 🔧 ฟังก์ชัน Login ใหม่ เชื่อมกับ MySQL
async function handleAdminLogin() {
  const emailInput = document.getElementById('loginEmailInput');
  const passwordInput = document.getElementById('loginPasswordInput');
  const loginError = document.getElementById('loginError');
  
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  if (!email || !password) {
    loginError.textContent = "กรุณากรอกข้อมูลให้ครบ";
    loginError.style.display = "block";
    return;
  }

  loginError.textContent = "⌛ กำลังเข้าสู่ระบบ...";
  loginError.style.display = "block";

  try {
    const response = await fetch(MYSQL_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ email, password })
    });

    const data = await response.json();

    if (data.status === 'success') {
      // เก็บข้อมูลลงเครื่อง
      localStorage.setItem('marine_admin_email', data.email);
      localStorage.setItem('marine_admin_role', data.role);
      localStorage.setItem('marine_admin_name', data.name);
      
      showAdminPanel(data);
    } else {
      loginError.textContent = data.message;
    }
  } catch (err) {
    loginError.textContent = "ไม่สามารถเชื่อมต่อ Server ได้";
  }
}

// 🔧 ฟังก์ชันแสดงผลและแบ่งสิทธิ์
function showAdminPanel(data) {
  ADMIN_EMAIL = data.email;
  ADMIN_ROLE = data.role;

  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('adminContent').style.display = 'block';
  document.getElementById('adminEmailDisplay').textContent = data.email;
  document.getElementById('adminRoleDisplay').textContent = `สิทธิ์: ${data.role.toUpperCase()}`;

  // แบ่งสิทธิ์การมองเห็นเมนู
  applyPermissions(data.role);
  
  Swal.fire({
    title: 'ยินดีต้อนรับ',
    text: `คุณ ${data.name} เข้าใช้งานในฐานะ ${data.role}`,
    icon: 'success',
    timer: 2000
  });
}

function applyPermissions(role) {
  // สิทธิ์สำหรับ Superadmin เท่านั้น
  const isSuper = (role === 'superadmin');
  document.getElementById('nav-settings').style.display = isSuper ? 'block' : 'none';
  document.getElementById('m-nav-settings').style.display = isSuper ? 'block' : 'none';
  document.getElementById('nav-adminManage').style.display = isSuper ? 'block' : 'none';
  document.getElementById('nav-adminActivity').style.display = isSuper ? 'block' : 'none';

  // สิทธิ์สำหรับ Viewer (ห้ามกดปุ่มแก้ไข/ลบ)
  if (role === 'viewer') {
    // โค้ดส่วนนี้จะทำงานเมื่อหน้าตารางโหลดเสร็จ (ในไฟล์ admin.js หลักของคุณ)
    console.log("โหมดอ่านอย่างเดียวเปิดใช้งาน");
  }
}

function handleAdminLogout() {
  localStorage.clear();
  location.reload();
}

// เช็คว่าเคยล็อกอินค้างไว้ไหม
window.onload = () => {
  const savedEmail = localStorage.getItem('marine_admin_email');
  const savedRole = localStorage.getItem('marine_admin_role');
  const savedName = localStorage.getItem('marine_admin_name');
  
  if (savedEmail && savedRole) {
    showAdminPanel({ email: savedEmail, role: savedRole, name: savedName });
  }
}
</script>
