<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="image/logo2.png">
    <title>Marine Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="loginForm" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:9999;">
    <div style="background:#fff;border-radius:16px;padding:40px;text-align:center;max-width:380px;width:90%;box-shadow:0 10px 30px rgba(0,0,0,0.5);">
      <div style="font-size:60px;margin-bottom:10px;">⚓</div>
      <h2 style="margin:0 0 20px;font-family:'Kanit';">Marine Admin</h2>
      
      <input type="email" id="loginEmailInput" placeholder="อีเมลแอดมิน" 
        style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;font-family:'Kanit';box-sizing:border-box;">
      
      <input type="password" id="loginPasswordInput" placeholder="รหัสผ่าน"
        style="width:100%;padding:12px;margin-bottom:15px;border:1px solid #ddd;border-radius:8px;font-family:'Kanit';box-sizing:border-box;"
        onkeydown="if(event.key==='Enter') handleAdminLogin()">
      
      <div id="loginError" style="color:#d32f2f;font-size:13px;margin-bottom:10px;display:none;font-family:'Kanit';"></div>
      
      <button onclick="handleAdminLogin()" style="background:#2563eb;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;font-family:'Kanit';font-weight:600;cursor:pointer;">🔐 เข้าสู่ระบบ</button>
    </div>
</div>

<div id="adminContent" style="display:none;width:100%;min-height:100vh;">
    <div class="admin-container">
        <aside class="sidebar">
            <div class="logo-area">
                <img src="image/logo.png" alt="Logo">
                <h2>⚓ ADMIN</h2>
                <p id="adminEmailDisplay" style="font-size:11px;color:#aaa;"></p>
                <p id="adminRoleDisplay" style="font-size:11px;color:#666;font-weight:600;"></p>
            </div>
            <button onclick="handleAdminLogout()" style="background:#dc2626;color:#fff;border:none;padding:8px 16px;border-radius:6px;width:90%;margin:10px auto;display:block;cursor:pointer;">🚪 ออกจากระบบ</button>
            <nav id="sideNav">
                <button onclick="show('dashboard')" class="nav-btn active">📊 สถิติภาพรวม</button>
                <button onclick="show('leaveRequests')" class="nav-btn">📩 คำขอลา</button>
                <button onclick="show('logs')" class="nav-btn">📋 บันทึกเข้าแถว</button>
                <button onclick="show('studentManage')" class="nav-btn">👨‍🎓 จัดการรายชื่อ</button>
            </nav>
        </aside>

        <main class="main">
            <section id="dashboard" class="page active">
                <h1>📊 Dashboard</h1>
                <div id="dashboardContent">
                    </div>
            </section>
            
            <section id="leaveRequests" class="page">
                <h1>📩 คำขอลา</h1>
                <div id="leaveBody"></div>
            </section>
            
            <section id="logs" class="page">
                <h1>📋 บันทึกการเข้าแถว</h1>
                <div id="logBody"></div>
            </section>
            
            <section id="studentManage" class="page">
                <h1>👨‍🎓 จัดการรายชื่อนักศึกษา</h1>
                <div id="studentAccordionContainer"></div>
            </section>
        </main>
    </div>
</div>

<script src="js/admin.js"></script>
</body>
</html>
